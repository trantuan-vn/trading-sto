syntax = "proto3";

package com.smartconsultor.microservice.gateway.adapter.dto.gateway.business;

option java_multiple_files = true;
option java_package = "com.smartconsultor.microservice.gateway.adapter.dto.gateway.business";
option java_outer_classname = "MaintenanceScheduledProto";

message MaintenanceScheduled {
  string startTime = 1;
  string duration = 2;
  string message = 3;
}
