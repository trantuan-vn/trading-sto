syntax = "proto3";

package com.smartconsultor.microservice.gateway.adapter.dto.gateway.business;

option java_multiple_files = true;
option java_package = "com.smartconsultor.microservice.gateway.adapter.dto.gateway.business";
option java_outer_classname = "WithdrawalProto";

message WithdrawalRequested {
  string userId = 1;
  double amount = 2;
  string destination = 3;
}

message WithdrawalConfirmed {
  string userId = 1;
  string transactionId = 2;
  double amount = 3;
  string confirmedAt = 4;
}

message WithdrawalRejected {
  string userId = 1;
  string reason = 2;
}
