syntax = "proto3";

package com.smartconsultor.microservice.gateway.adapter.dto.common;

option java_package = "com.smartconsultor.microservice.gateway.adapter.dto.common";
option java_outer_classname = "MessageTypeOuter";
option java_multiple_files = true;

enum MessageType {
  UNKNOWN = 0;
  HANDSHAKE = 1;
  RESUME = 2;
  BUSINESS = 3;
  ERROR = 4;
  HEARTBEAT = 5;
  ACK = 6;
}